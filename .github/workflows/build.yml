name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 注意：不要在这里列 'tools'。
          # 'tools' 是旧式 SDK 包名，现代 Google 仓库已不再提供，
          # sdkmanager 会以 "Warning: Failed to find package 'tools'" 报错退出
          # （曾导致 CI 在 "Set up Android SDK" 步骤直接失败）。
          # 需要的编译平台与构建工具在此显式安装，其余由 AGP 按需下载。
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: phonewebmcp-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK (unsigned)
        run: ./gradlew :app:assembleRelease --no-daemon
        continue-on-error: true

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: phonewebmcp-release-unsigned
          path: app/build/outputs/apk/release/*.apk
        continue-on-error: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phonewebmcp-debug
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
